[project]
name = "portsim"
version = "0.1.0"
description = "Seeded mock data for one simulated highway freight port (docks, LTL orders, gate records), for hackathon rehearsal"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "pandas>=1.5"]

[project.scripts]
portsim = "portsim.cli:main"

[dependency-groups]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
